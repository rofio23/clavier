<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavier gamer RGB</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="white">
<header>
  <h1>Clavier gamer RGB</h1>
  <div class="controls">
    <button class="choice active" data-theme="white">Clavier blanc</button>
    <button class="choice" data-theme="black">Clavier noir</button>
    <button id="mute" type="button">Son : activé</button>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <div class="glow"></div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
  <p class="hint">Tape sur ton clavier ou clique sur les touches.</p>
</main>
<script src="script.js"></script>
</body>
</html>
